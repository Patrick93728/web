<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Kripa:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
      } catch { /* The loading shell still works when storage is unavailable. */ }
    </script>
    <style>
      body { margin: 0; }
      .boot-skeleton { --boot-bg: #f4f4f3; --boot-card: #fff; --boot-line: #d7d7d7; --boot-fill: #dededc; min-height: 100vh; background: var(--boot-bg); color: #151515; font-family: Poppins, system-ui, sans-serif; }
      html.dark .boot-skeleton { --boot-bg: #101010; --boot-card: #1b1b1b; --boot-line: #3a3a3a; --boot-fill: #373737; color: #f5f5f5; }
      .boot-skeleton * { box-sizing: border-box; }
      .boot-skeleton__sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      .boot-skeleton__container { width: min(calc(100% - 56px), 1220px); margin-inline: auto; }
      .boot-skeleton__header { height: 76px; border-bottom: 1px solid var(--boot-line); background: var(--boot-card); }
      .boot-skeleton__header-inner, .boot-skeleton__brand, .boot-skeleton__nav, .boot-skeleton__actions { height: 100%; display: flex; align-items: center; gap: 14px; }
      .boot-skeleton__nav { margin-left: auto; gap: 26px; }
      .boot-skeleton__actions { margin-left: 18px; }
      .boot-skeleton__block { display: block; flex: none; max-width: 100%; border-radius: 6px; background: var(--boot-fill); animation: boot-skeleton-pulse 1.5s ease-in-out infinite alternate; }
      .boot-skeleton__circle { border-radius: 50%; }
      .boot-skeleton__avatar { width: 39px; height: 39px; }
      .boot-skeleton__brand-name { width: 124px; height: 16px; }
      .boot-skeleton__nav .boot-skeleton__block { width: 54px; height: 12px; }
      .boot-skeleton__toggle { width: 38px; height: 38px; }
      .boot-skeleton__hero { min-height: calc(100vh - 76px); min-height: calc(100svh - 76px); display: flex; flex-direction: column; justify-content: center; gap: 24px; padding-block: 72px; }
      .boot-skeleton__eyebrow { width: min(340px, 65%); height: 13px; margin-bottom: 4px; }
      .boot-skeleton__headline { width: min(680px, 90%); height: clamp(42px, 6vw, 72px); border-radius: 9px; }
      .boot-skeleton__headline--short { width: min(530px, 72%); }
      .boot-skeleton__copy { width: min(610px, 82%); height: 16px; }
      .boot-skeleton__copy--short { width: min(470px, 64%); margin-top: -12px; }
      .boot-skeleton__buttons, .boot-skeleton__pills { display: flex; flex-wrap: wrap; gap: 12px; }
      .boot-skeleton__buttons { margin-top: 10px; }
      .boot-skeleton__button { width: 156px; height: 48px; border-radius: 10px; }
      .boot-skeleton__pill { width: 138px; height: 32px; border-radius: 18px; }
      .boot-skeleton__section { padding-block: 82px; border-top: 1px solid var(--boot-line); }
      .boot-skeleton__section-head { display: grid; gap: 14px; margin-bottom: 30px; }
      .boot-skeleton__section-head .boot-skeleton__block:first-child { width: 92px; height: 12px; }
      .boot-skeleton__section-head .boot-skeleton__block:nth-child(2) { width: min(430px, 72%); height: 38px; }
      .boot-skeleton__section-head .boot-skeleton__block:last-child { width: min(570px, 88%); height: 16px; }
      .boot-skeleton__grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
      .boot-skeleton__card { min-width: 0; padding: 24px; border: 1px solid var(--boot-line); border-radius: 12px; background: var(--boot-card); }
      .boot-skeleton__card .boot-skeleton__block { margin-bottom: 14px; }
      .boot-skeleton__card .boot-skeleton__block:last-child { margin-bottom: 0; }
      .boot-skeleton__card-title { width: 62%; height: 24px; }
      .boot-skeleton__card-copy { width: 90%; height: 12px; }
      .boot-skeleton__card-copy--short { width: 68%; }
      .boot-skeleton__projects { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .boot-skeleton__media { width: 100%; aspect-ratio: 16 / 9; margin-bottom: 20px !important; border-radius: 7px; }
      .boot-skeleton__about { grid-template-columns: minmax(0, 1.4fr) minmax(180px, .6fr); align-items: center; }
      .boot-skeleton__portrait { width: min(100%, 230px); aspect-ratio: 4 / 5; margin: 0 auto !important; }
      .boot-skeleton__footer { height: 110px; border-top: 1px solid var(--boot-line); }
      .boot-skeleton__footer .boot-skeleton__container { height: 100%; display: flex; align-items: center; gap: 16px; }
      @keyframes boot-skeleton-pulse { to { opacity: .52; } }
      @media (max-width: 760px) {
        .boot-skeleton__container { width: min(calc(100% - 36px), 1220px); }
        .boot-skeleton__header { height: 66px; }
        .boot-skeleton__nav { display: none; }
        .boot-skeleton__actions { margin-left: auto; }
        .boot-skeleton__hero { min-height: calc(100vh - 66px); min-height: calc(100svh - 66px); }
        .boot-skeleton__grid { grid-template-columns: 1fr; }
        .boot-skeleton__projects { grid-template-columns: 1fr; }
        .boot-skeleton__about { grid-template-columns: 1fr; }
        .boot-skeleton__portrait { margin-left: 0 !important; }
      }
      @media (prefers-reduced-motion: reduce) { .boot-skeleton__block { animation: none; } }
    </style>

    <!-- SEO Meta -->
    <title>Hi I'm Patrick</title>
    <meta
      name="description"
      content="Explore web development, mobile app development, UI/UX design, integrations, and practical digital solutions for businesses, startups, and individuals."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Software Developer &amp; Digital Solutions Provider | Patrick Tomol" />
    <meta
      property="og:description"
      content="Explore web development, mobile app development, UI/UX design, integrations, and practical digital solutions for businesses, startups, and individuals."
    />
    <meta property="og:url" content="https://website-profile.tomolpatrick.workers.dev/" />
  </head>
  <body>
    <div id="root">
      <div class="boot-skeleton" role="status" aria-live="polite">
        <span class="boot-skeleton__sr-only">Loading Patrick Tomol's portfolio</span>
        <div aria-hidden="true">
          <header class="boot-skeleton__header">
            <div class="boot-skeleton__container boot-skeleton__header-inner">
              <div class="boot-skeleton__brand"><span class="boot-skeleton__block boot-skeleton__circle boot-skeleton__avatar"></span><span class="boot-skeleton__block boot-skeleton__brand-name"></span></div>
              <div class="boot-skeleton__nav"><span class="boot-skeleton__block"></span><span class="boot-skeleton__block"></span><span class="boot-skeleton__block"></span><span class="boot-skeleton__block"></span><span class="boot-skeleton__block"></span></div>
              <div class="boot-skeleton__actions"><span class="boot-skeleton__block boot-skeleton__circle boot-skeleton__toggle"></span></div>
            </div>
          </header>
          <main>
            <div class="boot-skeleton__container boot-skeleton__hero">
              <span class="boot-skeleton__block boot-skeleton__eyebrow"></span>
              <span class="boot-skeleton__block boot-skeleton__headline"></span>
              <span class="boot-skeleton__block boot-skeleton__headline boot-skeleton__headline--short"></span>
              <span class="boot-skeleton__block boot-skeleton__copy"></span>
              <span class="boot-skeleton__block boot-skeleton__copy boot-skeleton__copy--short"></span>
              <div class="boot-skeleton__buttons"><span class="boot-skeleton__block boot-skeleton__button"></span><span class="boot-skeleton__block boot-skeleton__button"></span></div>
              <div class="boot-skeleton__pills"><span class="boot-skeleton__block boot-skeleton__pill"></span><span class="boot-skeleton__block boot-skeleton__pill"></span><span class="boot-skeleton__block boot-skeleton__pill"></span></div>
            </div>
            <section class="boot-skeleton__section"><div class="boot-skeleton__container"><div class="boot-skeleton__section-head"><span class="boot-skeleton__block"></span><span class="boot-skeleton__block"></span><span class="boot-skeleton__block"></span></div><div class="boot-skeleton__grid"><div class="boot-skeleton__card"><span class="boot-skeleton__block boot-skeleton__card-title"></span><span class="boot-skeleton__block boot-skeleton__card-copy"></span><span class="boot-skeleton__block boot-skeleton__card-copy boot-skeleton__card-copy--short"></span></div><div class="boot-skeleton__card"><span class="boot-skeleton__block boot-skeleton__card-title"></span><span class="boot-skeleton__block boot-skeleton__card-copy"></span><span class="boot-skeleton__block boot-skeleton__card-copy boot-skeleton__card-copy--short"></span></div><div class="boot-skeleton__card"><span class="boot-skeleton__block boot-skeleton__card-title"></span><span class="boot-skeleton__block boot-skeleton__card-copy"></span><span class="boot-skeleton__block boot-skeleton__card-copy boot-skeleton__card-copy--short"></span></div></div></div></section>
            <section class="boot-skeleton__section"><div class="boot-skeleton__container"><div class="boot-skeleton__section-head"><span class="boot-skeleton__block"></span><span class="boot-skeleton__block"></span><span class="boot-skeleton__block"></span></div><div class="boot-skeleton__grid boot-skeleton__projects"><div class="boot-skeleton__card"><span class="boot-skeleton__block boot-skeleton__media"></span><span class="boot-skeleton__block boot-skeleton__card-title"></span><span class="boot-skeleton__block boot-skeleton__card-copy"></span></div><div class="boot-skeleton__card"><span class="boot-skeleton__block boot-skeleton__media"></span><span class="boot-skeleton__block boot-skeleton__card-title"></span><span class="boot-skeleton__block boot-skeleton__card-copy"></span></div></div></div></section>
            <section class="boot-skeleton__section"><div class="boot-skeleton__container boot-skeleton__grid boot-skeleton__about"><div class="boot-skeleton__card"><span class="boot-skeleton__block boot-skeleton__eyebrow"></span><span class="boot-skeleton__block boot-skeleton__headline boot-skeleton__headline--short"></span><span class="boot-skeleton__block boot-skeleton__card-copy"></span><span class="boot-skeleton__block boot-skeleton__card-copy boot-skeleton__card-copy--short"></span></div><span class="boot-skeleton__block boot-skeleton__portrait"></span></div></section>
            <section class="boot-skeleton__section"><div class="boot-skeleton__container"><div class="boot-skeleton__section-head"><span class="boot-skeleton__block"></span><span class="boot-skeleton__block"></span><span class="boot-skeleton__block"></span></div><div class="boot-skeleton__grid"><div class="boot-skeleton__card"><span class="boot-skeleton__block boot-skeleton__card-title"></span><span class="boot-skeleton__block boot-skeleton__card-copy"></span></div><div class="boot-skeleton__card"><span class="boot-skeleton__block boot-skeleton__card-title"></span><span class="boot-skeleton__block boot-skeleton__card-copy"></span></div><div class="boot-skeleton__card"><span class="boot-skeleton__block boot-skeleton__card-title"></span><span class="boot-skeleton__block boot-skeleton__card-copy"></span></div></div></div></section>
            <section class="boot-skeleton__section"><div class="boot-skeleton__container boot-skeleton__grid boot-skeleton__projects"><div class="boot-skeleton__card"><span class="boot-skeleton__block boot-skeleton__eyebrow"></span><span class="boot-skeleton__block boot-skeleton__headline boot-skeleton__headline--short"></span><span class="boot-skeleton__block boot-skeleton__card-copy"></span></div><div class="boot-skeleton__card"><span class="boot-skeleton__block boot-skeleton__card-title"></span><span class="boot-skeleton__block boot-skeleton__card-copy"></span><span class="boot-skeleton__block boot-skeleton__card-copy"></span></div></div></section>
          </main>
          <footer class="boot-skeleton__footer"><div class="boot-skeleton__container"><span class="boot-skeleton__block boot-skeleton__circle boot-skeleton__avatar"></span><span class="boot-skeleton__block boot-skeleton__brand-name"></span></div></footer>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
